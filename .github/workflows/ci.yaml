name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  checkout:
    runs-on: ubuntu-latest
    outputs:
      repo-cache-key: repo-${{ github.sha }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Ensures we get commit history for diffing

      - name: 🔄 Cache repository
        uses: actions/cache@v6
        with:
          path: . # Cache the entire repo
          key: repo-${{ github.sha }}

  changed-files:
    needs: checkout
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.changes.outputs.python }}
      python_files: ${{ steps.changes.outputs.python_files }}
      deps: ${{ steps.changes.outputs.deps }}
    steps:
      - name: 🔄 Restore repository from cache
        uses: actions/cache@v6
        with:
          path: .
          key: repo-${{ github.sha }}

      - name: 🔍 Detect changed files
        id: changes
        uses: dorny/paths-filter@v4.0.3
        with:
          list-files: shell
          filters: |
            python:
              - '**/*.py'
              - '**/*.pyi'
            deps:
              - 'uv.lock'
              - 'pyproject.toml'
              - '.github/workflows/**'

  ruff-linter:
    needs: changed-files
    runs-on: ubuntu-latest
    if: ${{ needs.changed-files.outputs.python == 'true' || needs.changed-files.outputs.deps == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 🔄 Restore repository from cache
        uses: actions/cache@v6
        with:
          path: .
          key: repo-${{ github.sha }}

      - uses: astral-sh/ruff-action@v4.1.0
        if: ${{ needs.changed-files.outputs.python == 'true' }}
        name: ✨ Lint with Ruff (only changed files)
        with:
          version: "latest"
          src: ${{ needs.changed-files.outputs.python_files }}
          args: check --output-format=github

  ruff-format:
    needs: changed-files
    runs-on: ubuntu-latest
    if: ${{ needs.changed-files.outputs.python == 'true' || needs.changed-files.outputs.deps == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 🔄 Restore repository from cache
        uses: actions/cache@v6
        with:
          path: .
          key: repo-${{ github.sha }}

      - uses: astral-sh/ruff-action@v4.1.0
        if: ${{ needs.changed-files.outputs.python == 'true' }}
        name: 📝 Format with Ruff (only changed files)
        with:
          version: "latest"
          src: ${{ needs.changed-files.outputs.python_files }}
          args: "format --diff"

  pylint:
    needs: changed-files
    runs-on: ubuntu-latest
    if: ${{ needs.changed-files.outputs.python == 'true' || needs.changed-files.outputs.deps == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 🔄 Restore repository from cache
        uses: actions/cache@v6
        with:
          path: .
          key: repo-${{ github.sha }}

      - name: 🛠️ Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 🦾 Install the project
        run: uv sync --all-extras

      - name: 🦾 Install pylint
        run: uv pip install pylint

      - name: 🔍 Run Pylint
        if: ${{ needs.changed-files.outputs.python == 'true' }}
        run: uv run pylint ${{ needs.changed-files.outputs.python_files }}

  sonarqube:
    needs:
      - checkout # Needs full repo
      - changed-files
      - ruff-linter
      - ruff-format
      - pylint
    runs-on: ubuntu-latest
    if: ${{ needs.changed-files.outputs.python == 'true' || needs.changed-files.outputs.deps == 'true' }}
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: 🔄 Restore repository from cache
        uses: actions/cache@v6
        with:
          path: .
          key: repo-${{ github.sha }}

      - name: 🛠️ Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 🦾 Install the project
        run: uv sync --all-extras

      - name: 🧪 Run pytest with coverage
        env:
          FIFTYONE_DATABASE_URI: mongodb://localhost:27017
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: uv run pytest --cov-report=xml

      - name: 🔎 SonarQube Cloud Scan (Full Repo)
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: 🧹 Minimize uv cache
        run: uv cache prune --ci
