[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "seametrics"
dynamic = ["version"]
authors = [{ name = "Kevin Serrano" }, { name = "Vasco Rodrigues" }]
description = "Custom metrics for evaluating performance of A.I. pipelines at SEA.AI"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

# Required dependencies
dependencies = [
  "numpy>=1.22.2",
  "pandas>=1.1.4",
  "pycocotools>=2.0.0",
  "tqdm>=4.64.0",
  "typing_extensions>=4.7.0",
  "motmetrics>=1.4.0",
  "scipy>=1.7.0",
]

[project.optional-dependencies]
fiftyone = ["fiftyone>=0.23.4"]
panoptic = [
  "torch",
  "torchmetrics>=1.4.0",
  "cleanlab",
  "transformers",
  "scipy",
]
test = [
  "pytest>=7",
  "pytest-cov>=4",
  "pytest-mock>=3",
]

[project.urls]
Homepage = "https://github.com/SEA-AI/seametrics"
Issues = "https://github.com/SEA-AI/seametrics/issues"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["seametrics"]

[dependency-groups]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "pytest-mock>=3",
  "ruff",
  "pylint",
]

# Pytest settings
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q --cov --tb=short --cov-report=term:skip-covered"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]

# Coverage settings
[tool.coverage.report]
include = ["seametrics/*"]
exclude_lines = ["if TYPE_CHECKING"]

# Pylint settings
[tool.pylint]
ignored-modules = ["cv2"]
jobs = 0
ignore = ["tests", "docs", "build", ".venv"]
max-args = 10
max-attributes = 10
max-line-length = 120
min-similarity-lines = 6
disable = [
  "import-outside-toplevel",
  "missing-function-docstring",
  "logging-fstring-interpolation",
  "too-few-public-methods",
]
